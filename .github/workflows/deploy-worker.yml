name: Deploy API (Cloudflare Worker)

# Выкладывает worker/ в Cloudflare при каждом изменении папки worker/ в main
# и по кнопке Actions → Deploy API → Run workflow.
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Проверка секретов
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KREA_API_TOKEN: ${{ secrets.KREA_API_TOKEN }}
          ACCESS_KEYS: ${{ secrets.ACCESS_KEYS }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ANTHROPIC_API_KEY KREA_API_TOKEN ACCESS_KEYS; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Не заданы GitHub Secrets:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          node -e 'JSON.parse(process.env.ACCESS_KEYS)' || { echo "::error::ACCESS_KEYS — не JSON"; exit 1; }

      - name: Деплой
        run: npx --yes wrangler@4 deploy

      - name: Секреты Worker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KREA_API_TOKEN: ${{ secrets.KREA_API_TOKEN }}
          ACCESS_KEYS: ${{ secrets.ACCESS_KEYS }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
        run: |
          umask 077
          node -e '
            const s = {};
            for (const k of ["ANTHROPIC_API_KEY", "KREA_API_TOKEN", "ACCESS_KEYS"]) s[k] = process.env[k];
            // Kimi необязателен: если секрета нет, переключатель нейросети просто не появится
            if (process.env.MOONSHOT_API_KEY) s.MOONSHOT_API_KEY = process.env.MOONSHOT_API_KEY;
            require("fs").writeFileSync("/tmp/secrets.json", JSON.stringify(s));
          '
          npx --yes wrangler@4 secret bulk /tmp/secrets.json
          rm -f /tmp/secrets.json

      - name: Проверка
        run: |
          # Первый деплой на workers.dev может открываться до пары минут — проверка не блокирует
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://api.smm-studio-api-workers-dev.workers.dev/api/health; then exit 0; fi
            sleep 10
          done
          echo "::warning::API пока не отвечает — проверьте через пару минут"
