name: Deploy Kaiten hook (Cloudflare Worker)

# Ретранслятор вебхуков Kaiten → робот kaiten-automation.
# Выкладывается при изменении папки kaiten-hook/ и по кнопке Actions → Deploy Kaiten hook → Run workflow.
on:
  push:
    branches: [main]
    paths:
      - "kaiten-hook/**"
      - ".github/workflows/deploy-kaiten-hook.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-kaiten-hook
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: kaiten-hook
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HOOK_SECRET: ${{ secrets.HOOK_SECRET }}
      HOOK_GH_TOKEN: ${{ secrets.HOOK_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Проверка секретов
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID HOOK_SECRET HOOK_GH_TOKEN; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Не заданы GitHub Secrets:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Деплой
        run: npx --yes wrangler@4 deploy

      - name: Секреты Worker
        run: |
          umask 077
          node -e 'require("fs").writeFileSync("/tmp/s.json", JSON.stringify({HOOK_SECRET: process.env.HOOK_SECRET, HOOK_GH_TOKEN: process.env.HOOK_GH_TOKEN}))'
          npx --yes wrangler@4 secret bulk /tmp/s.json
          rm -f /tmp/s.json

      - name: Проверка
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://kaiten-hook.smm-studio-api-workers-dev.workers.dev/health; then exit 0; fi
            sleep 10
          done
          echo "::warning::kaiten-hook пока не отвечает — проверьте через пару минут"
